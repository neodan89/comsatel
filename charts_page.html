<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <title>Starlink Dashboard</title>
    <meta name="description" content="Dashboard de Starlink" />

    <link
      rel="stylesheet"
      href="./_astro/change_password_internal.qM1rKszx.css"
    />
    <link
      rel="stylesheet"
      href="./_astro/change_password_internal.op1M1DQ9.css"
    />

    <style>
      @media (width >= 940px) {
        main[data-astro-cid-zzhxnavi] {
          margin: 9.5rem 0 6rem 0rem;
        }
      }
    </style>
  </head>

  <body
    class="w-full h-full bg-[url('./imgs/bg.webp')] bg-cover bg-center bg-no-repeat font-['Muli'] overflow-y-scroll grid min-h-[100dvh] grid-rows-[auto_1fr_auto]"
  >
    <!-- ================= HEADER ================= -->
    <header
      class="w-full h-[9.5rem] flex flex-col gap-2 pt-8 m-0 px-[5%] text-[var(--blanco-08)] bg-[var(--azul-primario-04)] backdrop-blur-md fixed z-20"
    >
      <div
        class="flex w-full justify-between border border-[var(--blanco-04)] sm:border-none rounded-xl sm:rounded-none"
      >
        <!-- Home -->
        <a
          href="./services.html"
          class="m-0 w-1/3 h-14 sm:w-28 bg-[var(--azul-primario-04)] backdrop-blur-sm py-2 pr-4 sm:p-0 glass-effect m-only"
        >
          <img
            src="./icons/icon-home-filled.svg"
            class="h-full w-14 sm:w-9 pl-3 sm:p-0"
          />
        </a>

        <!-- User Profile -->
        <div
          id="userProfileBtn"
          class="border-none sm:border sm:border-[var(--blanco-06)] sm:rounded-xl sm:box-border w-2/3 sm:w-max sm:grow flex justify-between items-center h-14 bg-[var(--azul-noche-04)] backdrop-blur-sm sm:px-3"
        >
          <div class="h-full flex items-center">
            <img
              src="./icons/icon-user.svg"
              alt="User"
              class="h-full py-2 pr-2"
            />
            <span>Kevin Briones</span>
          </div>

          <img
            id="arrowIcon"
            src="./icons/icon-arrow-down.svg"
            alt="More"
            class="h-full p-3 sm:px-0 cursor-pointer transition-transform duration-300 rotate-0"
          />
        </div>
      </div>

      <!-- Back Button -->
      <a
        href="./starlink.html"
        id="arrowLeft"
        class="flex items-center gap-1 w-fit h-6 bg-[var(--azul-primario-04)] backdrop-blur-sm text-[var(--blanco-08)] no-underline text-xs font-semibold absolute left-0 md:left-[5%] top-28 hover:text-[var(--cyan-neon)] transition-colors duration-300 py-2 pr-4 rounded-lg glass-effect"
      >
        <!-- SVG -->
        Regresar
      </a>

      <!-- User Menu -->
      <div
        id="userMenu"
        class="flex h-fit w-full sm:w-[calc(100%_-_112px)] border border-[var(--blanco-total)] rounded-xl p-4 bg-[var(--azul-noche-04)] backdrop-blur-[12px] invisible opacity-0 -translate-y-[10px] transition-all duration-300 relative z-10 sm:left-28 [&.show-menu]:visible [&.show-menu]:opacity-100 [&.show-menu]:translate-y-0 glass-effect"
      >
        <div class="user-menu-row">
          <p>Correo: <span id="company-email">correo@mail.com</span></p>
          <p>Empresa: <span id="company-name">Nivek</span></p>

          <div class="flex justify-between items-center md:gap-60">
            <a href="./change_password_internal.html" class="menu-link">
              Cambio de clave
            </a>
            <button id="logoutBtn" class="menu-link-btn">Cerrar Sesión</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main
      class="w-[90%] sm:w-full sm:pl-[calc(5%_+_112px)] sm:pr-[5%] mt-[9.5rem] mb-24 mx-auto"
      data-astro-cid-zzhxnavi
    >
      <astro-island
        component-url="./_astro/Subscription.Bgl6s7Zh.js"
        client="load"
      ></astro-island>

      <astro-island
        component-url="./_astro/Device.d8iFpre3.js"
        client="load"
      ></astro-island>

      <astro-island
        component-url="./_astro/Device.d8iFpre3.js"
        client="load"
      ></astro-island>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="dashboard-footer">
      <img src="imgs/logo-white.svg" alt="Comsatel Logo" class="footer-logo" />
      <span class="footer-text">COMSATEL</span>
    </footer>

    <!-- ================= SCRIPTS ================= -->
    <script type="module">
      const profileBtn = document.getElementById("userProfileBtn");
      const menu = document.getElementById("userMenu");
      const arrow = document.getElementById("arrowIcon");
      const logoutBtn = document.getElementById("logoutBtn");

      const closeMenu = () => {
        menu?.classList.remove("show-menu");
        arrow?.classList.remove("flip");
      };

      profileBtn?.addEventListener("click", (e) => {
        e.stopPropagation();
        menu?.classList.toggle("show-menu");
        arrow?.classList.toggle("flip");
      });

      document.addEventListener("click", (e) => {
        if (menu?.classList.contains("show-menu") && !menu.contains(e.target)) {
          closeMenu();
        }
      });

      logoutBtn?.addEventListener("click", () => {
        localStorage.removeItem("usuarioLogueado");
        window.location.href = "";
      });
    </script>
  </body>
</html>
